name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify npm version
        run: test "$(npm --version)" = "11.19.0"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check:frontend

      - name: Lint frontend
        run: npm run lint:frontend

      - name: Check application metadata consistency
        run: npm run metadata:check

      - name: Validate assets and attribution
        run: npm run assets:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend context for Tauri macros
        run: npm run build

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.98.0

      - name: Fetch Rust dependencies
        run: cargo fetch --locked

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

  tauri-shell:
    name: Tauri shell
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Compile native Tauri application
        run: npm run tauri:build -- --debug --no-bundle

      - name: Smoke-test bundled frontend under release CSP
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set +e
          timeout 8s xvfb-run -a target/debug/vc-classic-video-games > tauri-build-smoke.log 2>&1
          status=$?
          set -e
          cat tauri-build-smoke.log
          test "$status" -eq 124

      - name: Smoke-test tauri dev under Xvfb
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          set +e
          timeout 30s xvfb-run -a npm run tauri:dev -- --no-watch > tauri-dev.log 2>&1
          status=$?
          set -e
          cat tauri-dev.log
          test "$status" -eq 124
          grep -F "Running" tauri-dev.log
          grep -F "target/debug/vc-classic-video-games" tauri-dev.log
